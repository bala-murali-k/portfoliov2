<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://foo.tld/portfoliov2/projects becomes
      // https://foo.tld/portfoliov2/?/projects
      var pathSegmentsToKeep = 1;

      var currentLocation = window.location;
      currentLocation.replace(
        currentLocation.protocol + '//' + currentLocation.hostname + (currentLocation.port ? ':' + currentLocation.port : '') +
        currentLocation.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        currentLocation.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (currentLocation.search ? '&' + currentLocation.search.slice(1).replace(/&/g, '~and~') : '') +
        currentLocation.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
